name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (3 ABIs) + AAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Rust + Android targets
        run: |
          rustup toolchain install 1.91 --profile minimal --component rustc,cargo,rust-std
          rustup default 1.91
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble release AAR (bundles 3 ABIs)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew :tor:bundleAndroidMainAar -PreleaseBuild=true --no-configuration-cache
      - name: Verify release ABI matrix (arm64-v8a, armeabi-v7a, x86_64)
        run: |
          AAR=tor/build/outputs/aar/tor.aar
          echo "Inspecting $AAR"
          unzip -l "$AAR" | grep 'jni/.*/libarti_kmp_ffi\.so'
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$AAR" | grep -q "jni/$abi/libarti_kmp_ffi.so" || { echo "MISSING ABI: $abi"; exit 1; }
          done
          echo "All 3 expected ABIs present."

  apple:
    name: iOS (device + simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Rust + Apple targets
        run: |
          rustup toolchain install 1.91 --profile minimal --component rustc,cargo,rust-std
          rustup default 1.91
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustup component add llvm-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Kotlin/Native (iosArm64 + iosSimulatorArm64)
        run: ./gradlew :tor:compileKotlinIosArm64 :tor:compileKotlinIosSimulatorArm64 -PreleaseBuild=true --no-configuration-cache
